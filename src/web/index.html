<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rank-it</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>"
    />
  </head>
  <body>
    <header class="app-header">
      <h1>rank-it</h1>
      <p>Rank the movies, shows, and games you have completed.</p>
      <div class="user-bar">
        <label for="user-select">Ranking as</label>
        <select id="user-select" aria-label="Current user"></select>
        <button id="add-user" class="ghost" type="button">New user</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Categories"></nav>

    <main class="content">
      <section class="add-panel">
        <form id="add-form" autocomplete="off">
          <input
            id="title"
            name="title"
            type="text"
            placeholder="Title"
            required
            aria-label="Title"
          />
          <button type="submit">Add &amp; rank</button>
        </form>
      </section>

      <section id="list-panel" class="list-panel" aria-live="polite"></section>
    </main>

    <div id="ranking-overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Ranking</h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
